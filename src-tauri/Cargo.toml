[package]
name = "kode"
version = "0.1.0"
description = "A Cursor-like code editor with AI chat support for CLI code agents"
authors = ["Kode Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
walkdir = "2"
fuzzy-matcher = "0.3"
ignore = "0.4"
notify = "8"
async-channel = "2"
thiserror = "2"
lazy_static = "1.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
